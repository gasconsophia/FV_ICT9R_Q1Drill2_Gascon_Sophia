<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Q1 Drill2</title>
	<style>
		body{
			background-color:skyblue ;
			font-family:Gill Sans,Gill Sans MT,Calibri,Trebuchet M, sans-serif
		}
		header{
			text-align:center;
		}
		section{
		background-color:#87CEEB;
		padding:20px;
		border-radius:15px;
		width:700px ;
		margin:auto;
		box-shadow:0 4px 10px rgba(0, 0, 0, 1.0) ;
		}

		img{
			display:block;
			margin:auto;
			height:100px;
			width:100px;
			padding:0px;
		}

		input[type=text],select,textarea,input[type="submit"]{
			width:130px;
			padding:20px ;
			border:1px solid #ccc;
			border-radius:5px;
			text-align:center;
		}

		input[type=placeholder]{
			text-align:center;
		}
	
	    </style>
</head>
<body>
	<header>
		<h1>RATE A MOVIE</h1>
		<br>
		<p>Rate a movie that matches you the best!</p>
		<header>

		<br>

		<section>
			<form action="">
				<img 
		        src="https://www.creativefabrica.com/product/cinema-logo-design-templates-vector-9/">
				<br>

				<label for="movie">Movie Title</label>
				<input type="text" id="movie" name="movie" placeholder="Enter here...">

				<br>
				<label for="">Genre/s</label>
				<input type="checkbox" id="genre1"name="Genre1"value="Action">
				<label for="genre1">Action</label>

				<input type="checkbox" id="genre2"name="Genre2"value="Comedy">
				<label for="genre2">Comedy</label>

				<input type="checkbox" id="genre3" name="Genre3" value="Horror">
				<label for="genre3">Horror</label>

				<input type="checkbox" id="genre4" name="Genre4" value="Romance">
				<label for="genre4">Romance</label>

				<input type="checkbox" id="genre5" name="Genre5" value="Sci-fi">
				<label for="genre5">Sci-fi</label>

				<br>
				<label for="rating">Rating</label>
				<br>
				<input type="radio" id="rate1" name="rate"value="star1">
				<label for="rate1">⭐</label>

				<input type="radio" id="rate2" name="rate"value="star2">
				<label for="rate2">⭐</label>

				<input type="radio" id="rate3" name="rate" value="star3">
				<label for="rate3">⭐</label>

				<input type="radio" id="rate4" name="rate" value="star4">
				<label for="rate4">⭐</label>

				<input type="radio" id="rate5" name="rate" value="star5">
				<label for="rate5">⭐</label>

				<br>
				<textarea id="review" name="review" placeholder="PLace review here..."rows="5" cols="40"></textarea>
				<br>

				<input type="submit" id="submit" name="submit"value="Submit Review">
				<br>

				For movie review tips,click <a href="https://www.nyfa.edu/student-resources/9-tips-for-writing-a-film-review/"
				target="blank">here<a/>
				     </form>

				</section>


</body>
</html>
